<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meta Tags and CSS Selectors</title>

    <style>
        /* Element selector */
        p {
            font-size: 18px;
        }

        /* Class selector */
        .highlight {
            color: blue;
            font-weight: bold;
        }

        /* ID selector */
        #special {
            background-color: lightgray;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Meta Tags and CSS Selectors</h1>

    <p>This is a paragraph styled with an element selector.</p>

    <p class="highlight">
        This paragraph uses a class selector.
    </p>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

</body>
</html>
