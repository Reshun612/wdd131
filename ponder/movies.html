<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WDD 131 Week 6 Ponder demonstrating dynamic movie content with JavaScript.">
  <meta name="author" content="Dedrick Irby">
  <title>WDD 131 | Dynamic Content</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #182b3a; background: #f2f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.5rem 1rem; line-height: 1.6; }
    main { max-width: 1000px; margin: auto; }
    header { background: #003b64; color: #fff; padding: 1.5rem 2rem; border-radius: 12px; margin-bottom: 1.5rem; }
    header h1 { margin: 0; }
    header p { margin: .25rem 0 0; color: #e1f0fc; }
    #movie-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 1.25rem; }
    .movie-summary { display: grid; grid-template-columns: 130px 1fr; gap: 1rem; align-items: start; background: #fff; padding: 1.25rem; border: 1px solid #d7e1e9; border-radius: 10px; box-shadow: 0 3px 12px rgba(0,35,65,.06); }
    .movie-summary img { width: 100%; height: auto; border-radius: 6px; }
    .movie-summary h2 { margin: 0 0 .35rem; color: #005b91; font-size: 1.2rem; line-height: 1.3; }
    .movie-summary p { margin: .3rem 0; }
    .movie-meta { font-size: .9rem; color: #425768; }
    .stars { color: #b77900; letter-spacing: .08em; }
    @media (max-width: 520px) { .movie-summary { grid-template-columns: 90px 1fr; padding: .8rem; gap: .75rem; } }
  </style>
  <script src="movies.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>WDD 131: Dynamic Content</h1>
      <p>Week 6 Ponder — movie reviews added to the page with JavaScript</p>
    </header>
    <section id="movie-list" aria-label="Movie Reviews"></section>
  </main>
</body>
</html>
