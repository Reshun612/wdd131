<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet Snortleblat, a swamp beast diplomat. View character stats and use JavaScript object methods to attack and level up.">
  <meta name="author" content="Dedrick Irby">

  <!-- Open Graph social media information -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Character Card | WDD 131">
  <meta property="og:description" content="Meet Snortleblat, a swamp beast diplomat. Explore character stats and JavaScript object methods.">
  <meta property="og:url" content="https://reshun612.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat-og.png">

  <!-- Twitter social media information -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Character Card | WDD 131">
  <meta name="twitter:description" content="Meet Snortleblat, a swamp beast diplomat. Explore character stats and JavaScript object methods.">
  <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat-og.png">

  <link rel="icon" href="https://wddbyui.github.io/wdd131/images/favicon.ico">
  <title>Character Card | WDD 131</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="course-label">WDD 131 · Week 8 Prove</p>
      <h1>Character Card</h1>
      <p>Use the buttons to interact with the character object.</p>
    </header>

    <section class="card" aria-labelledby="character-name">
      <img class="image" id="character-image"
        src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
        alt="Snortleblat, a swamp beast diplomat" width="400" height="400">
      <h2 class="name" id="character-name">Snortleblat</h2>

      <div class="stats" aria-label="Character statistics">
        <p><strong>Class:</strong> <span id="character-class">Swamp Beast Diplomat</span></p>
        <p><strong>Level:</strong> <span id="character-level">5</span></p>
        <p><strong>Health:</strong> <span id="character-health">100</span></p>
      </div>

      <div class="buttons">
        <button type="button" id="attacked">Attacked</button>
        <button type="button" id="levelup">Level Up</button>
      </div>
      <p class="log" id="log" role="status" aria-live="polite">Snortleblat is ready for an adventure.</p>
    </section>

    <footer class="page-footer">
      <p>WDD 131 · Dynamic Web Fundamentals</p>
      <p>Created by Dedrick Irby</p>
    </footer>
  </main>
</body>
</html>
